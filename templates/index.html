<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikCloud — Загрузчик TikTok</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-[#0b0f19] text-gray-900 dark:text-white min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white transition-colors duration-300">
    
    <!-- Верхняя панель -->
    <header class="w-full max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-tr from-pink-500 to-indigo-600 p-2 rounded-xl shadow-lg flex items-center justify-center">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"></path></svg>
            </div>
            <span class="text-xl font-bold tracking-wide">TikCloud</span>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="toggleTheme()" class="bg-white dark:bg-[#161b26] hover:bg-gray-200 dark:hover:bg-[#1f2636] border border-gray-300 dark:border-gray-800 p-2.5 rounded-full text-gray-700 dark:text-gray-300 transition shadow-sm" title="Сменить тему">
                <svg id="themeIcon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
            <div class="flex items-center gap-2 bg-white dark:bg-[#161b26] border border-gray-300 dark:border-gray-800 px-3.5 py-2 rounded-full text-xs font-medium text-gray-800 dark:text-gray-200 shadow-sm">
                <span class="text-sky-500">⚡</span> Cloud Fast
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="w-full max-w-xl mx-auto px-4 flex flex-col items-center my-auto -mt-12">
        <h1 class="text-4xl font-extrabold tracking-tight text-center mb-3">
            Загрузчик <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-teal-400">TikCloud</span>
        </h1>
        <p class="text-sm text-gray-500 dark:text-gray-400 text-center mb-8">
            Скачивайте видео, MP3 и фото-карусели из TikTok без водяных знаков.
        </p>

        <!-- Поле ввода ссылки -->
        <div class="w-full bg-white dark:bg-[#131824] rounded-2xl shadow-xl p-3 border border-gray-300 dark:border-gray-800 flex items-center gap-2 transition-colors duration-300">
            <div class="relative flex-1 flex items-center">
                <span class="absolute left-4 text-gray-400 dark:text-gray-500">🔗</span>
                <input type="text" id="urlInput" placeholder="Вставьте ссылку на видео или фото-карусель..." 
                       class="w-full pl-11 pr-4 py-3 bg-gray-50 dark:bg-[#0d111a] rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-500 text-sm border border-gray-300 dark:border-gray-800 text-gray-900 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500 transition-colors duration-300">
            </div>
            <button onclick="fetchData()" id="searchBtn" 
                    class="bg-pink-600 hover:bg-pink-700 px-6 py-3 rounded-xl font-semibold transition flex items-center gap-2 shadow-lg shadow-pink-600/25 text-sm whitespace-nowrap text-white">
                🔍 Найти
            </button>
        </div>

        <!-- Блок ошибок -->
        <div id="errorBox" class="hidden w-full mt-4 p-4 bg-red-100 dark:bg-red-950/80 border border-red-400 dark:border-red-500/50 rounded-xl text-red-700 dark:text-red-200 text-xs"></div>

        <!-- Блок результата для видео/аудио -->
        <div id="resultBoxVideo" class="hidden w-full bg-white dark:bg-[#131824] rounded-2xl shadow-xl p-4 border border-gray-300 dark:border-gray-800 mt-4 space-y-4 transition-colors duration-300">
            <div class="flex gap-4 items-center bg-gray-50 dark:bg-[#0d111a] p-3 rounded-xl border border-gray-200 dark:border-gray-800">
                <img id="thumbVideo" class="w-20 h-20 object-cover rounded-lg bg-gray-200 dark:bg-gray-800" src="" alt="Thumbnail">
                <div class="flex-1 min-w-0">
                    <h2 id="videoTitle" class="font-medium text-xs text-gray-800 dark:text-gray-200 line-clamp-2"></h2>
                </div>
            </div>

            <button onclick="downloadMedia('video')" class="w-full py-3.5 bg-pink-600 hover:bg-pink-700 rounded-xl font-semibold text-xs text-center transition shadow-md text-white flex items-center justify-center gap-2">
                📥 Скачать видео без водяного знака
            </button>

            <button onclick="downloadMedia('audio')" class="w-full py-3 bg-gray-200 dark:bg-[#1c2333] hover:bg-gray-300 dark:hover:bg-[#252f45] text-gray-800 dark:text-white rounded-xl font-semibold text-xs text-center transition border border-gray-300 dark:border-gray-700 flex items-center justify-center gap-2">
                🎵 Скачать аудио (MP3)
            </button>
        </div>

        <!-- Блок результата для фото-карусели -->
        <div id="resultBoxPhotos" class="hidden w-full bg-white dark:bg-[#131824] rounded-2xl shadow-xl p-4 border border-gray-300 dark:border-gray-800 mt-4 space-y-4 transition-colors duration-300">
            <h2 class="font-semibold text-sm text-gray-800 dark:text-gray-200 text-center">🖼️ Выберите фотографии для скачивания:</h2>
            
            <!-- Сетка фоток -->
            <div id="photosGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3 max-h-72 overflow-y-auto p-1">
                <!-- Сюда динамически добавятся картинки с чекбоксами -->
            </div>

            <button onclick="downloadSelectedPhotos()" class="w-full py-3.5 bg-pink-600 hover:bg-pink-700 rounded-xl font-semibold text-xs text-center transition shadow-md text-white flex items-center justify-center gap-2">
                📥 Скачать выбранные фото
            </button>
        </div>
    </main>

    <!-- Подвал -->
    <footer class="w-full text-center text-xs text-gray-500 dark:text-gray-500 py-6 border-t border-gray-200 dark:border-gray-900">
        © 2026 TikCloud. Все права защищены.
    </footer>

    <script>
        let cachedMediaData = null;

        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                themeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                themeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>';
                localStorage.setItem('theme', 'dark');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeIcon').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>';
            }
        });

        async function fetchData() {
            const url = document.getElementById('urlInput').value.trim();
            const errorBox = document.getElementById('errorBox');
            const resultBoxVideo = document.getElementById('resultBoxVideo');
            const resultBoxPhotos = document.getElementById('resultBoxPhotos');
            const searchBtn = document.getElementById('searchBtn');

            errorBox.classList.add('hidden');
            resultBoxVideo.classList.add('hidden');
            resultBoxPhotos.classList.add('hidden');
            cachedMediaData = null;

            if (!url) {
                errorBox.innerText = 'Пожалуйста, введите ссылку на TikTok';
                errorBox.classList.remove('hidden');
                return;
            }

            searchBtn.disabled = true;
            searchBtn.innerText = 'Поиск...';

            try {
                const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}&hd=1`);
                const data = await res.json();

                if (data.code !== 0) {
                    throw new Error('Не удалось найти медиа. Проверьте правильность ссылки.');
                }

                cachedMediaData = data.data;

                // Проверяем, карусель это или обычное видео
                if (cachedMediaData.images && cachedMediaData.images.length > 0) {
                    // Рендерим фото-карусель
                    const grid = document.getElementById('photosGrid');
                    grid.innerHTML = '';
                    
                    cachedMediaData.images.forEach((imgUrl, index) => {
                        grid.innerHTML += `
                            <label class="relative group cursor-pointer block rounded-xl overflow-hidden border-2 border-transparent hover:border-pink-500 transition">
                                <input type="checkbox" name="photoCheck" value="${imgUrl}" checked class="absolute top-2 left-2 z-10 w-4 h-4 accent-pink-600 rounded">
                                <img src="${imgUrl}" class="w-full h-28 object-cover bg-gray-200 dark:bg-gray-800 group-hover:scale-105 transition duration-300">
                                <div class="absolute bottom-1 right-1 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded">#${index + 1}</div>
                            </label>
                        `;
                    });
                    resultBoxPhotos.classList.remove('hidden');
                } else {
                    // Обычное видео
                    document.getElementById('videoTitle').innerText = cachedMediaData.title || 'Видео TikTok';
                    document.getElementById('thumbVideo').src = cachedMediaData.cover || '';
                    resultBoxVideo.classList.remove('hidden');
                }
            } catch (err) {
                errorBox.innerText = err.message || 'Ошибка соединения с API';
                errorBox.classList.remove('hidden');
            } finally {
                searchBtn.disabled = false;
                searchBtn.innerText = '🔍 Найти';
            }
        }

        async function downloadMedia(type) {
            const errorBox = document.getElementById('errorBox');
            errorBox.classList.add('hidden');

            if (!cachedMediaData) return;

            const mediaLink = type === 'audio' ? cachedMediaData.music : (cachedMediaData.hdplay || cachedMediaData.play);
            if (!mediaLink) {
                errorBox.innerText = 'Ссылка на файл не найдена';
                errorBox.classList.remove('hidden');
                return;
            }

            const randomId = Math.floor(1000 + Math.random() * 9000);
            const ext = type === 'audio' ? 'mp3' : 'mp4';
            const fileName = `clip_TikCloud_${randomId}.${ext}`;

            try {
                const res = await fetch(mediaLink);
                const blob = await res.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);
            } catch (err) {
                window.open(mediaLink, '_blank');
            }
        }

        async function downloadSelectedPhotos() {
            const errorBox = document.getElementById('errorBox');
            errorBox.classList.add('hidden');

            const checkboxes = document.querySelectorAll('input[name="photoCheck"]:checked');
            if (checkboxes.length === 0) {
                errorBox.innerText = 'Выберите хотя бы одну фотографию';
                errorBox.classList.remove('hidden');
                return;
            }

            // Скачиваем каждую выбранную фотографию с уникальным суффиксом
            for (let checkbox of checkboxes) {
                const imgUrl = checkbox.value;
                const randomId = Math.floor(1000 + Math.random() * 9000);
                const fileName = `clip_TikCloud_photo_${randomId}.jpg`;

                try {
                    const res = await fetch(imgUrl);
                    const blob = await res.blob();
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(downloadUrl);
                    // Небольшая задержка между скачиваниями, чтобы браузер не заблокировал пачку файлов
                    await new Promise(r => setTimeout(r, 400));
                } catch (err) {
                    window.open(imgUrl, '_blank');
                }
            }
        }
    </script>
</body>
</html>
