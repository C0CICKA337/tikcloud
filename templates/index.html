<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikCloud — Скачивание видео</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f1015;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            text-align: center;
        }
        h1 {
            margin-bottom: 24px;
            font-size: 2rem;
            color: #ff3366;
        }
        .input-group {
            display: flex;
            gap: 10px;
            background: #1a1c23;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #2a2d3d;
        }
        input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 1rem;
            padding: 0 10px;
        }
        button {
            background: #ff3366;
            color: #white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #e02e5b;
        }
        #resultContainer {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #1a1c23;
            border: 1px solid #2a2d3d;
            display: none;
            word-break: break-all;
        }
        .download-btn {
            display: inline-block;
            margin-top: 10px;
            background: #00C853;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .download-btn:hover {
            background: #00b048;
        }
        .error-text {
            color: #ff5252;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>TikCloud Downloader</h1>
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Вставь ссылку на TikTok или YouTube...">
            <button id="submitBtn">Найти</button>
        </div>
        <div id="resultContainer"></div>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const submitBtn = document.getElementById('submitBtn');
        const resultContainer = document.getElementById('resultContainer');

        submitBtn.addEventListener('click', async () => {
            const videoUrl = urlInput.value.trim();
            if (!videoUrl) return;

            resultContainer.style.display = 'block';
            resultContainer.innerHTML = 'Загрузка...';

            try {
                // Отправляем запрос через публичный клиентский API (запросы идут с IP пользователя)
                const response = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url: videoUrl })
                });

                const data = await response.json();

                if (data.status === 'error' || data.error || !data.url && !data.picker) {
                    throw new Error(data.text || data.message || 'Не удалось получить видео');
                }

                // Достаем ссылку на скачивание
                const downloadUrl = data.url || (data.picker && data.picker[0] && data.picker[0].url);

                resultContainer.innerHTML = `
                    <p style="margin-bottom: 10px;"><b>Название:</b> ${data.filename || 'Видео готово'}</p>
                    <a href="${downloadUrl}" target="_blank" class="download-btn">Скачать видео</a>
                `;

            } catch (err) {
                resultContainer.innerHTML = `<p class="error-text">Ошибка: ${err.message}</p>`;
                console.error(err);
            }
        });
    </script>

</body>
</html>
